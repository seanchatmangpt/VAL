[package]
name = "val-pddl-lsp"
version = "26.7.27"
edition = "2021"
rust-version = "1.82"
description = "Ontology-rendered PDDL language server for VAL using lsp-max"
license = "BSD-3-Clause"
repository = "https://github.com/seanchatmangpt/VAL"
publish = false

[[bin]]
name = "pddl-lsp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
lsp-max = { version = "26.7.3", features = ["proposed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
pretty_assertions = "1"
