name: pddl-lsp

on:
  pull_request:
    paths:
      - "pddl-lsp/**"
      - ".github/workflows/pddl-lsp.yml"
  push:
    branches: [master]
    paths:
      - "pddl-lsp/**"
      - ".github/workflows/pddl-lsp.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Verify ontology projection
        run: |
          python3 pddl-lsp/scripts/render_ontology.py --check
          python3 pddl-lsp/scripts/verify_ontology.py
      - name: Test
        run: |
          set -o pipefail
          cargo test --manifest-path pddl-lsp/Cargo.toml --all-features 2>&1 | tee cargo-test.log
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --manifest-path pddl-lsp/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee cargo-clippy.log
      - name: Upload verifier transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pddl-lsp-verifier-transcripts
          path: |
            cargo-test.log
            cargo-clippy.log
          if-no-files-found: ignore
